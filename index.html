<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLLAR AI - Grok x Pakasir</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Poppins,sans-serif;display:flex;justify-content:center;padding:16px}
.card{width:100%;max-width:440px;background:#161616;border:1px solid #2a2a2a;border-radius:24px;padding:20px}
.chat{background:#0f0f0f;border:1px solid #222;border-radius:16px;height:320px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:14px;max-width:85%;font-size:13px;line-height:1.4}
.user{background:#fff;color:#000;align-self:flex-end}
.ai{background:#1f1f1f;color:#00ff88;border:1px solid #2a2a2a}
input{width:100%;background:#000;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;margin-top:8px;outline:none}
button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:10px;cursor:pointer}
.btn-grok{background:#fff;color:#000}
.btn-pay{background:#ff3b30;color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.quick span{background:#222;border:1px solid #333;padding:6px 10px;border-radius:20px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h2>DOLLAR <span style="color:#ff3b30">AI</span></h2>
  <p style="color:#666;font-size:11px">Kurs Rp17.800 • Grok + Pakasir • QRIS/VA Auto</p>
  <div id="chat" class="chat">
    <div class="msg ai">Yo bro! Gua Grok AI. Tanya aja: "$300 berapa rupiah?" atau "all group berapa?"</div>
  </div>
  <div class="quick">
    <span onclick="setQ('$300 berapa?')">$300 berapa?</span>
    <span onclick="setQ('all group $5 - $1000 berapa?')">All group</span>
    <span onclick="setQ('Cara bayar Pakasir gimana?')">Cara bayar</span>
  </div>
  <div style="display:flex;gap:8px">
    <input id="usd" type="number" value="300" style="width:90px" placeholder="$">
    <input id="q" type="text" placeholder="Tanya Grok...">
  </div>
  <button class="btn-grok" onclick="askGrok()">🤖 Tanya Grok AI</button>
  <input id="email" type="email" placeholder="Email pembeli (buat bayar)">
  <button class="btn-pay" onclick="pay()">💳 Bayar via Pakasir</button>
  <p style="font-size:10px;color:#444;text-align:center;margin-top:12px">Webhook: /.netlify/functions/pakasir-webhook</p>
</div>
<script>
const chat=document.getElementById('chat');
function add(t,type){let d=document.createElement('div');d.className='msg '+type;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function setQ(t){document.getElementById('q').value=t; askGrok()}
async function askGrok(){
  let usd=document.getElementById('usd').value||0;
  let q=document.getElementById('q').value||`${usd} dollar berapa rupiah?`;
  add(q,'user'); document.getElementById('q').value=''; add('Grok mikir...','ai');
  let r=await fetch('/.netlify/functions/grok',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,usd})});
  let j=await r.json(); chat.lastChild.remove(); add(j.answer,'ai');
}
async function pay(){
  let usd=document.getElementById('usd').value, email=document.getElementById('email').value;
  if(!email) return alert('Isi email dulu!');
  add(`Mau bayar $${usd} via Pakasir...`,'user');
  let r=await fetch('/.netlify/functions/pakasir-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usd,email})});
  let j=await r.json(); let url=j.payment_url||j.checkout_url||j.url||j.data?.payment_url;
  if(url) location.href=url; else alert(JSON.stringify(j));
}
</script>
</body>
</html>
